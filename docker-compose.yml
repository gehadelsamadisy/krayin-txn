# Krayin CRM with the TXN edits.
#
# Settings and keys come from .env next to this file (copy .env.example).
# Start and update with ./scripts/deploy.sh, not plain "docker compose up":
# deploy.sh builds the image (txn-krayin:current) this file runs.
#
# Containers are disposable; everything that matters is a bind mount on the
# host, in ./data (never in Git), so rebuilding or updating keeps it:
#   data/mysql         MySQL database files (and binary logs)
#   data/logs/mysql    MySQL error log + slow query log
#   data/storage       Krayin uploads, cache, sessions
#   data/logs/krayin   Krayin (Laravel) logs, rotated daily, 14 days
#   data/backups       backups from scripts/backup.sh
# Plus .env (settings, keys, APP_KEY) next to this file.
#
# Never use "docker compose down -v" habits, delete ./data, or change these
# mount paths: a container pointed at an empty folder starts with no data.
name: krayin

# Docker's own console logs: capped, so they can't fill the disk. They're
# removed when a container is recreated; the real logs are in data/logs.
x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

x-krayin: &krayin
  image: txn-krayin:current
  restart: unless-stopped
  volumes:
    - ./.env:/var/www/laravel-crm/.env:ro
    - ./data/storage:/var/www/laravel-crm/storage
    - ./data/logs/krayin:/var/www/laravel-crm/storage/logs
  logging: *logging
  labels:
    com.txn.app: krayin

services:
  krayin-mysql:
    # Exact patch version; change it only with ./scripts/update-mysql.sh.
    image: mysql:${MYSQL_VERSION:-8.4.11}
    container_name: krayin-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-krayin}
      MYSQL_USER: ${DB_USERNAME:-krayin_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      TZ: UTC
    # Settings as arguments so they apply everywhere. Extra settings of your
    # own go in mysql/conf.d/*.cnf.
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00
      - --sql-mode=ONLY_FULL_GROUP_BY,STRICT_TRANS_TABLES,NO_ZERO_IN_DATE,NO_ZERO_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION
      - --innodb-buffer-pool-size=${MYSQL_BUFFER_POOL:-1G}
      - --binlog-expire-logs-seconds=604800
      - --log-error=/var/log/mysql/error.log
      - --slow-query-log=ON
      - --slow-query-log-file=/var/log/mysql/slow.log
      - --long-query-time=2
    volumes:
      - ./data/mysql:/var/lib/mysql
      - ./data/logs/mysql:/var/log/mysql
      - ./mysql/conf.d:/etc/mysql/conf.d:ro
    # Reachable only from this machine (and through an SSH tunnel).
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging: *logging
    labels:
      com.txn.app: krayin

  krayin:
    <<: *krayin
    container_name: krayin
    environment:
      TXN_INIT: "1"
    # KRAYIN_BIND in .env: 127.0.0.1 = this machine only (default);
    # 0.0.0.0 = also other computers on the network (http://<server-ip>:8080).
    ports:
      - "${KRAYIN_BIND:-127.0.0.1}:${KRAYIN_HTTP_PORT:-8080}:80"
    depends_on:
      krayin-mysql:
        condition: service_healthy

  krayin-queue:
    <<: *krayin
    container_name: krayin-queue
    command: ["runuser", "-u", "www-data", "--", "php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--max-time=3600"]
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'artisan queue:work' >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      krayin:
        condition: service_healthy

  # Off unless KRAYIN_SCHEDULER=true in .env (deploy.sh then starts it).
  # Krayin's own schedule: inbound-emails:process every 5 min, campaign:process daily.
  krayin-scheduler:
    <<: *krayin
    container_name: krayin-scheduler
    profiles: ["scheduler"]
    command: ["runuser", "-u", "www-data", "--", "php", "artisan", "schedule:work"]
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'artisan schedule:work' >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      krayin:
        condition: service_healthy
